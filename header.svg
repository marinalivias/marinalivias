<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" fill="none" role="img" aria-labelledby="t d">
  <title id="t">Marina | Backend Developer</title>
  <desc id="d">A constellation shaped like a neural network: Java, Spring Boot and PostgreSQL feed into Python and PyTorch, which lead to AI and Deep Learning. A small telescope points at it.</desc>
  <defs>
    <radialGradient id="glow">
      <stop stop-color="#C9D1D9" stop-opacity=".35" />
      <stop offset="1" stop-color="#C9D1D9" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="haze" cx=".72" cy=".5" r=".5">
      <stop stop-color="#1F2937" stop-opacity=".7" />
      <stop offset="1" stop-color="#0D1117" stop-opacity="0" />
    </radialGradient>
  </defs>
  <style>
    text { font-family: 'Fira Code', 'JetBrains Mono', Consolas, monospace; font-size: 13px; fill: #8B949E; }
    .tw { animation: tw 4s ease-in-out infinite alternate; }
    .late { animation-delay: -2s; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes tw { from { opacity: .55; } to { opacity: 1; } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .pulse { display: none; }
      .tw, .cursor { animation: none; }
    }
  </style>

  <rect width="1000" height="340" rx="16" fill="#0D1117" />
  <rect width="1000" height="340" rx="16" fill="url(#haze)" />

  <!-- Star chart grid -->
  <g stroke="#8B949E" stroke-opacity=".05" stroke-dasharray="2 6">
    <line x1="100" y1="0" x2="100" y2="340" /><line x1="200" y1="0" x2="200" y2="340" /><line x1="300" y1="0" x2="300" y2="340" /><line x1="400" y1="0" x2="400" y2="340" /><line x1="500" y1="0" x2="500" y2="340" /><line x1="600" y1="0" x2="600" y2="340" /><line x1="700" y1="0" x2="700" y2="340" /><line x1="800" y1="0" x2="800" y2="340" /><line x1="900" y1="0" x2="900" y2="340" /><line x1="0" y1="85" x2="1000" y2="85" /><line x1="0" y1="170" x2="1000" y2="170" /><line x1="0" y1="255" x2="1000" y2="255" />
  </g>
  <text x="982" y="324" text-anchor="end" font-size="10" fill="#484F58" style="font-size:10px;fill:#484F58">RA 05h 35m 17s  DEC -05 23' 28"</text>

  <!-- Background stars -->
  <g fill="#E6EDF3" opacity=".45">
    <circle cx="40" cy="40" r="1" /><circle cx="130" cy="300" r="1" /><circle cx="260" cy="28" r="1" /><circle cx="330" cy="310" r="1" /><circle cx="410" cy="70" r="1" /><circle cx="470" cy="280" r="1" /><circle cx="640" cy="40" r="1" /><circle cx="650" cy="300" r="1" /><circle cx="790" cy="60" r="1" /><circle cx="800" cy="300" r="1" /><circle cx="930" cy="50" r="1" /><circle cx="960" cy="240" r="1" /><circle cx="900" cy="310" r="1" /><circle cx="30" cy="200" r="1" /><circle cx="380" cy="180" r="1" />
  </g>

  <!-- Intro -->
  <text x="70" y="118" style="font-size:14px;fill:#6E7681">// hello, world</text>
  <text x="66" y="176" font-family="'Segoe UI', Arial, sans-serif" style="font-family:'Segoe UI', Arial, sans-serif;font-size:56px;font-weight:700;fill:#E6EDF3">Marina</text>
  <text x="70" y="212" style="font-size:18px;fill:#C9D1D9">backend developer</text>
  <rect class="cursor" x="245" y="198" width="9" height="17" fill="#C9D1D9" />
  <text x="70" y="242" style="font-size:13px;fill:#6E7681">data  /  ai  /  physics</text>

</svg>
